[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "spatialvi-tools"
version = "0.1.0"
description = "Consolidated spatial transcriptomics analysis toolkit with variational inference methods"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "YosefLab", email = "yoseflab@berkeley.edu" },
]
maintainers = [
    { name = "YosefLab", email = "yoseflab@berkeley.edu" },
]
keywords = [
    "spatial transcriptomics",
    "single-cell",
    "variational inference",
    "deep learning",
    "deconvolution",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Documentation = "https://spatialvi-tools.readthedocs.io/"
Source = "https://github.com/YosefLab/spatialvi-tools"
Home-page = "https://github.com/YosefLab/spatialvi-tools"

[project.optional-dependencies]
dev = [
    "pre-commit",
    "twine>=4.0.2",
]
doc = [
    "docutils>=0.8,!=0.18.*,!=0.19.*",
    "ipykernel",
    "ipython",
    "myst-nb>=1.1",
    "pandas",
    # Until pybtex >0.24.0 releases
    "setuptools",
    "sphinx>=8.1",
    "sphinx-autodoc-typehints",
    "sphinx-book-theme>=1",
    "sphinx-copybutton",
    "sphinx-tabs",
    "sphinxcontrib-bibtex>=1",
    "sphinxext-opengraph",
]
test = [
    "coverage>=7.10",
    "pytest",
    "pytest-cov",
]
jax = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "flax>=0.7.0",
    "optax>=0.1.7",
]
all = [
    "spatialvi-tools[dev,doc,test,jax]",
]

dependencies = [
    # Core dependencies
    "anndata>=0.10",
    # For debug logging (referenced from the issue template)
    "session-info2",
    "mudata>=0.2.0",
    "scanpy>=1.9",
    "numpy>=1.21",
    "scipy>=1.9",
    "pandas>=1.5",
    "scikit-learn>=1.0",
    # Deep learning
    "torch>=2.0",
    "lightning>=2.0",
    "pyro-ppl>=1.8.0",
    # Utilities
    "rich>=13.0",
    "tqdm>=4.64",
    "xarray>=2023.1",
    "h5py>=3.7",
    # Visualization
    "matplotlib>=3.6",
    "seaborn>=0.12",
    # scvi-tools base (for shared utilities)
    "scvi-tools>=1.1.0",
]

[tool.hatch.build]
include = [
    "src/spatialvi/*.py",
    "src/spatialvi/**/*.py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spatialvi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
addopts = [
    "--import-mode=importlib",
]

[tool.ruff]
line-length = 120
src = ["src"]
extend-include = ["*.ipynb"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.coverage.run]
source = ["spatialvi"]
omit = ["**/test_*.py"]

[tool.hatch.envs.default]
installer = "uv"
features = ["dev"]

[tool.hatch.envs.docs]
features = ["doc"]
scripts.build = "sphinx-build -M html docs/source docs/_build -W {args}"
scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
scripts.clean = "git clean -fdX -- {args:docs}"

# Test the lowest and highest supported Python versions with normal deps
[[tool.hatch.envs.hatch-test.matrix]]
deps = ["stable"]
python = ["3.10", "3.12"]

# Test the newest supported Python version also with pre-release deps
[[tool.hatch.envs.hatch-test.matrix]]
deps = ["pre"]
python = ["3.12"]

[tool.hatch.envs.hatch-test]
features = ["dev", "test"]

[tool.hatch.envs.hatch-test.overrides]
# If the matrix variable `deps` is set to "pre",
# set the environment variable `UV_PRERELEASE` to "allow".
matrix.deps.env-vars = [
  { key = "UV_PRERELEASE", value = "allow", if = ["pre"] },
]

[tool.ruff.lint]
select = [
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "C4",     # flake8-comprehensions
    "D",      # pydocstyle
    "E",      # Error detected by Pycodestyle
    "F",      # Errors detected by Pyflakes
    "I",      # isort
    "RUF100", # Report unused noqa directives
    "TID",    # flake8-tidy-imports
    "UP",     # pyupgrade
    "W",      # Warning detected by Pycodestyle
]
ignore = [
    "B008",  # Errors from function calls in argument defaults
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    "D105",  # __magic__ methods are often self-explanatory
    "D107",  # Missing docstring in __init__
    "D203",  # We don't want a blank line before a class docstring
    "D213",  # We want docstrings to start immediately after the opening triple quote
    "D400",  # first line should end with a period
    "D401",  # First line should be in imperative mood
    "E501",  # line too long
    "E731",  # Do not assign a lambda expression
    "E741",  # allow I, O, l as variable names
]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]
"docs/*" = ["I"]
"tests/*" = ["D"]

[tool.cruft]
skip = [
    "tests",
    "src/**/__init__.py",
    "src/**/basic.py",
    "docs/api.md",
    "docs/changelog.md",
    "docs/references.bib",
    "docs/references.md",
    "docs/notebooks/example.ipynb",
]
