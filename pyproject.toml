[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "spatialvi-tools"
version = "0.1.0"
description = "Consolidated spatial transcriptomics analysis toolkit with variational inference methods"
readme = "README.md"
keywords = [
  "deconvolution",
  "deep learning",
  "single-cell",
  "spatial transcriptomics",
  "variational inference",
]
license = { file = "LICENSE" }
maintainers = [
  { name = "YosefLab", email = "yoseflab@berkeley.edu" },
]
authors = [
  { name = "YosefLab", email = "yoseflab@berkeley.edu" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
  # Core dependencies
  "anndata>=0.11",
  "h5py>=3.7",
  "lightning>=2",
  # Visualization
  "matplotlib>=3.6",
  "mudata>=0.2",
  "numpy>=1.21",
  "pandas",
  "pyro-ppl",
  # Utilities
  "rich",
  "scanpy[skmisc]>=1.10",
  "scikit-learn",
  "scipy",
  # scvi-tools base (for shared utilities)
  "scvi-tools",
  "seaborn",
  # For debug logging (referenced from the issue template)
  "session-info2",
  # Deep learning
  "torch",
  "torchmetrics",
  "tqdm",
  "xarray",
]
optional-dependencies.all = [
  "spatialvi-tools[dev,doc,jax,test]",
]
optional-dependencies.dev = [
  "pre-commit",
  "twine>=4.0.2",
]
optional-dependencies.doc = [
  "docutils>=0.8,!=0.18.*,!=0.19.*",
  "ipykernel",
  "ipython",
  "myst-nb>=1.1",
  "pandas",
  # Until pybtex >0.24.0 releases
  "setuptools",
  "sphinx>=8.1",
  "sphinx-autodoc-typehints",
  "sphinx-book-theme>=1",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinx-tabs",
  "sphinxcontrib-bibtex>=1",
  "sphinxext-opengraph",
]
optional-dependencies.jax = [
  "flax>=0.7",
  "jax>=0.4.20",
  "jaxlib>=0.4.20",
  "optax>=0.1.7",
]
optional-dependencies.test = [
  "coverage>=7.10",
  "pytest",
  "pytest-cov",
]
urls.Documentation = "https://spatialvi-tools.readthedocs.io/"
urls.Home-page = "https://github.com/YosefLab/spatialvi-tools"
urls.Source = "https://github.com/YosefLab/spatialvi-tools"

[tool.hatch.build]
include = [
  "src/spatialvi/*.py",
  "src/spatialvi/**/*.py",
]

[tool.hatch.build.targets.wheel]
packages = [ "src/spatialvi" ]

[tool.hatch.envs.default]
installer = "uv"
features = [ "dev" ]

[tool.hatch.envs.docs]
features = [ "doc" ]
scripts.build = "sphinx-build -M html docs/source docs/_build -W {args}"
scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
scripts.clean = "git clean -fdX -- {args:docs}"

# Test the lowest and highest supported Python versions with normal deps
[[tool.hatch.envs.hatch-test.matrix]]
deps = [ "stable" ]
python = [ "3.11", "3.12", "3.13" ]

# Test the newest supported Python version also with pre-release deps
[[tool.hatch.envs.hatch-test.matrix]]
deps = [ "pre" ]
python = [ "3.12" ]

[tool.hatch.envs.hatch-test]
features = [ "dev", "test" ]

[tool.hatch.envs.hatch-test.overrides]
# If the matrix variable `deps` is set to "pre",
# set the environment variable `UV_PRERELEASE` to "allow".
matrix.deps.env-vars = [
  { key = "UV_PRERELEASE", value = "allow", if = [ "pre" ] },
]

[tool.ruff]
line-length = 120
src = [ "src" ]
extend-include = [ "*.ipynb" ]

format.docstring-code-format = true
lint.select = [
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "E",      # Error detected by Pycodestyle
  "F",      # Errors detected by Pyflakes
  "I",      # isort
  "RUF100", # Report unused noqa directives
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # Warning detected by Pycodestyle
]
lint.ignore = [
  "B008", # Errors from function calls in argument defaults
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D105", # __magic__ methods are often self-explanatory
  "D107", # Missing docstring in __init__
  "D203", # We don't want a blank line before a class docstring
  "D213", # We want docstrings to start immediately after the opening triple quote
  "D400", # first line should end with a period
  "D401", # First line should be in imperative mood
  "E501", # line too long
  "E731", # Do not assign a lambda expression
  "E741", # allow I, O, l as variable names
]
lint.per-file-ignores."*/__init__.py" = [ "F401" ]
lint.per-file-ignores."docs/*" = [ "I" ]
lint.per-file-ignores."tests/*" = [ "D" ]
lint.pydocstyle.convention = "numpy"

[tool.pytest.ini_options]
testpaths = [ "tests" ]
xfail_strict = true
addopts = [
  "--import-mode=importlib",
]

[tool.coverage.run]
source = [ "spatialvi" ]
omit = [ "**/test_*.py" ]

[tool.cruft]
skip = [
  "tests",
  "src/**/__init__.py",
  "src/**/basic.py",
  "docs/api.md",
  "docs/changelog.md",
  "docs/references.bib",
  "docs/references.md",
  "docs/notebooks/example.ipynb",
]
