name: test

on:
  push:
    branches: [main, "[0-9]+.[0-9]+.x"]
  pull_request:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -e {0}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]

    name: integration (${{ matrix.python }})

    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel uv
          python -m uv pip install --system "spatialvi-tools[test] @ ."
          python -m uv pip install --system "squidpy>=1.4"

      - name: Run pytest
        env:
          MPLBACKEND: agg
          PLATFORM: ${{ matrix.os }}
          DISPLAY: :42
          COLUMNS: 120
        # 3.14 is aspirational — PyTorch/scvi-tools wheels may not exist
        continue-on-error: ${{ matrix.python == '3.14' }}
        run: |
          coverage run -m pytest -v --color=yes
          coverage report

      - uses: codecov/codecov-action@v4
        if: matrix.python == '3.13'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: integration
