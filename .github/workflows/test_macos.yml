name: test (macos)

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, opened]
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Run only when PR has label "macos tests" or "all tests", or on schedule/manual trigger
    if: >-
      (
        contains(github.event.pull_request.labels.*.name, 'macos tests') ||
        contains(github.event.pull_request.labels.*.name, 'all tests') ||
        (contains(github.event_name, 'schedule') && github.repository == 'YosefLab/scviva-tools') ||
        contains(github.event_name, 'workflow_dispatch')
      )

    runs-on: macos-14

    defaults:
      run:
        shell: bash -e {0}

    name: integration

    env:
      OS: macos-14
      PYTHON: "3.13"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel uv
          python -m uv pip install --system "scviva-tools[test,spatial] @ ."

      - name: Run pytest
        env:
          MPLBACKEND: agg
          PLATFORM: macos-14
          DISPLAY: :42
          COLUMNS: 120
        run: |
          coverage run -m pytest -v --color=yes
          coverage report

      - uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: macos
