name: Test GPU

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-gpu:
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[test,spatial,rapids]"
      - run: pytest tests/ -v -m "gpu"
