name: test (cuda)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [labeled, synchronize, opened]
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Run only when PR has label "cuda tests" or "all tests", or on schedule/manual trigger
    if: >-
      (
        contains(github.event.pull_request.labels.*.name, 'cuda tests') ||
        contains(github.event.pull_request.labels.*.name, 'all tests') ||
        (contains(github.event_name, 'schedule') && github.repository == 'YosefLab/spatialvi-tools') ||
        contains(github.event_name, 'workflow_dispatch')
      )

    runs-on: [self-hosted, Linux, X64, CUDA]

    defaults:
      run:
        shell: bash -e {0}

    name: integration

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "**/pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -e ".[test,spatial,rapids]"

      - name: Run pytest
        env:
          MPLBACKEND: agg
          COLUMNS: 120
        run: |
          pytest tests/ -v --color=yes --accelerator cuda --devices auto

      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: cuda
